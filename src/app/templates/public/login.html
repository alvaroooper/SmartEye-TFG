<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - TFG</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #1c1e21; text-align: center; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #4b4f56; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 1rem; }
        button:hover { background-color: #004494; }
        .error-msg { color: #dc3545; background: #f8d7da; padding: 10px; border-radius: 4px; display: none; margin-bottom: 1rem; text-align: center; }
        .footer-link { text-align: center; margin-top: 1rem; font-size: 0.9rem; }
        .back-link a { color: #888; text-decoration: none; font-weight: 500; transition: color 0.2s; }
        .back-link a:hover { color: #0056b3; text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Identificación</h2>
    <div id="errorBox" class="error-msg"></div>
    
    <form id="formLogin">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="ejemplo@tfg.es" required>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit" id="btnEntrar">Entrar</button>
    </form>

    <div class="footer-link">
        ¿No tienes cuenta? <a href="/registro">Regístrate aquí</a>
    </div>

    <div class="footer-link back-link" style="margin-top: 1.5rem;">
        <a href="/">← Volver al inicio</a>
    </div>
</div>

<script>
    document.getElementById('formLogin').onsubmit = async function(e) {
        e.preventDefault();
        
        localStorage.clear(); 
        sessionStorage.clear();

        const errorBox = document.getElementById('errorBox');
        const btn = document.getElementById('btnEntrar');
        
        errorBox.style.display = 'none';
        btn.innerText = "Cargando...";
        btn.disabled = true;

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                sessionStorage.setItem('jwt_token', data.token);
                sessionStorage.setItem('nombre_usuario', data.usuario);
                sessionStorage.setItem('roles', JSON.stringify(data.roles));

                if (data.roles.includes('admin')) {
                    window.location.replace('/admin');
                } else {
                    window.location.replace('/dashboard');
                }
            } else {
                errorBox.innerText = data.mensaje || "Error al iniciar sesión";
                errorBox.style.display = 'block';
            }
        } catch (err) {
            errorBox.innerText = "Error de conexión con el servidor";
            errorBox.style.display = 'block';
        } finally {
            btn.innerText = "Entrar";
            btn.disabled = false;
        }
    };
</script>

</body>
</html>
