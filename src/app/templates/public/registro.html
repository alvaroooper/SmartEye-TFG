<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Cuenta - TFG</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { color: #1c1e21; text-align: center; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.4rem; color: #4b4f56; font-size: 0.9rem; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 1rem; }
        button:hover { background-color: #218838; }
        .error-msg { color: #dc3545; background: #f8d7da; padding: 10px; border-radius: 4px; display: none; margin-bottom: 1rem; text-align: center; font-size: 0.9rem; }
        .success-msg { color: #155724; background: #d4edda; padding: 10px; border-radius: 4px; display: none; margin-bottom: 1rem; text-align: center; font-size: 0.9rem; }
        .footer-link { text-align: center; margin-top: 1rem; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="register-card">
    <h2>Registro de Usuario</h2>
    <div id="errorBox" class="error-msg"></div>
    <div id="successBox" class="success-msg"></div>
    
    <form id="formRegistro">
        <div class="form-group">
            <label>Nombre Completo / Visible</label>
            <input type="text" id="nombre_visible" placeholder="Ej: Alvaro Pérez" required>
        </div>
        <div class="form-group">
            <label>Nombre de Usuario (Username)</label>
            <input type="text" id="username" placeholder="ej: alvaro99" required>
        </div>
        <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" id="email" placeholder="correo@ejemplo.com" required>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="password" minlength="6" required>
        </div>
        <button type="submit" id="btnRegistrar">Crear Cuenta</button>
    </form>

    <div class="footer-link">
        ¿Ya tienes cuenta? <a href="/login">Inicia sesión aquí</a>
    </div>
</div>

<script>
    document.getElementById('formRegistro').onsubmit = async function(e) {
        e.preventDefault();
        const errorBox = document.getElementById('errorBox');
        const successBox = document.getElementById('successBox');
        const btn = document.getElementById('btnRegistrar');
        
        errorBox.style.display = 'none';
        successBox.style.display = 'none';
        btn.disabled = true;

        const payload = {
            nombre_visible: document.getElementById('nombre_visible').value,
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch('/api/v1/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                // GUARDAR EL TOKEN AUTOMÁTICAMENTE
                sessionStorage.setItem('jwt_token', data.token);
                sessionStorage.setItem('nombre_usuario', data.usuario);
                sessionStorage.setItem('roles', JSON.stringify(data.roles));
                
                successBox.innerText = "¡Cuenta creada con éxito! Entrando...";
                successBox.style.display = 'block';

                // REDIRECCIÓN DIRECTA SEGÚN ROL
                setTimeout(() => {
                    if (data.roles.includes('admin')) {
                        window.location.href = '/admin';
                    } else {
                        window.location.href = '/dashboard';
                    }
                }, 1500);
            } else {
                errorBox.innerText = data.mensaje || "Error en el registro";
                errorBox.style.display = 'block';
                btn.disabled = false;
            }
        } catch (err) {
            errorBox.innerText = "Error de conexión";
            errorBox.style.display = 'block';
            btn.disabled = false;
        }
    };
</script>

</body>
</html>
